# main에 push하면 사이트(hosting)와 Firestore 규칙을 배포한다.
# 순서는 CLAUDE.md대로 hosting 먼저, 그다음 firestore.
# 필요한 저장소 비밀값: FIREBASE_SERVICE_ACCOUNT (mahamuder 서비스 계정 키 JSON 전체)
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "shots/**"
      - "**.md"
      - "feature-*.html"
      - "murder_mystery_games.csv"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write service account key
        run: printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # predeploy가 npm run build를 실행한다. 빌드 로그에 "게임 N개를"이 없으면 게임 페이지가 빠진 것.
      - name: Deploy hosting
        run: npx --yes firebase-tools@15.34.1 deploy --only hosting --project mahamuder --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@15.34.1 deploy --only firestore --project mahamuder --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
